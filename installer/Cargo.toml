[package]
name = "shobika-installer"
version = "0.1.0"
edition = "2021"
description = "Graphical installer for ShobikaOs"

[dependencies]
gtk4 = "0.9"
glib = "0.20"
gio = "0.20"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"