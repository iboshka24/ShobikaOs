# ShobikaOs Foot Config
# ~/.config/foot/foot.ini

[main]
font=JetBrains Mono:size=11
bold-font=JetBrains Mono:weight=bold:size=11
italic-font=JetBrains Mono:italic:size=11
bold-italic-font=JetBrains Mono:weight=bold:italic:size=11
dpi-aware=yes
max-history-size=10000
scrollback-lines=10000
urgent-on-bell=true
bell-action=visual
term=xterm-256color
shell=/bin/bash
login-shell=no
title=ShobikaOs Terminal
app-id=foot
window-size-pixels=1200x800
window-padding=12
window-minimized=false
window-startup-mode=normal
resize-by-keystroke=true
locked-title=no
hide-cursor-when-typing=true
cursor-style=block
cursor-blink=yes
cursor-blink-interval=0.5
render-timer=0
render-timer-format=frame: {}ms total: {}ms
damage=full

[colors]
# Catppuccin Mocha palette
background=1e1e2e
foreground=cdd6f4
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8
dim0=313244
dim1=f38ba8
dim2=a6e3a1
dim3=f9e2af
dim4=89b4fa
dim5=f5c2e7
dim6=94e2d5
dim7=a6adc8
selection=89b4fa
selection-foreground=1e1e2e

[cursor]
text=1e1e2e
cursor=89b4fa

[mouse]
hide-when-typing=true
alternate-scroll-mode=shift

[keyboard]
bind=ctrl+shift+c=copy
bind=ctrl+shift+v=paste
bind=ctrl+shift+n=spawn-new-terminal
bind=ctrl+plus=increase-font-size
bind=ctrl+minus=decrease-font-size
bind=ctrl+0=reset-font-size
bind=ctrl+shift+t=new-tab
bind=ctrl+shift+w=close-tab
bind=ctrl+shift+Left=move-tab-left
bind=ctrl+shift+Right=move-tab-right