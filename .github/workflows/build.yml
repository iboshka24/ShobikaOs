name: Build ShobikaOs ISO

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64

jobs:
  build-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GTK4 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libglib2.0-dev librsvg2-dev pkg-config

      - name: Build installer (Rust)
        run: |
          cd installer
          cargo build --release

      - name: Upload installer binary
        uses: actions/upload-artifact@v4
        with:
          name: shobika-installer
          path: installer/target/release/shobika-installer
          retention-days: 7

  build-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build branding package
        run: |
          # Verify PKGBUILD structure
          ls -la packages/branding/
          ls -la packages/config/
          echo "Branding package structure verified"

      - name: Upload branding sources
        uses: actions/upload-artifact@v4
        with:
          name: shobikaos-branding
          path: packages/branding/
          retention-days: 7

  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [build-installer, build-branding]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download installer binary
        uses: actions/download-artifact@v4
        with:
          name: shobika-installer
          path: installer/target/release/

      - name: Download branding sources
        uses: actions/download-artifact@v4
        with:
          name: shobikaos-branding
          path: packages/branding/

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y archiso qemu-system-x86 ovmf rsync imagemagick librsvg2-bin

      - name: Copy installer binary to ISO
        run: |
          mkdir -p iso/airootfs/usr/bin
          cp installer/target/release/shobika-installer iso/airootfs/usr/bin/
          chmod +x iso/airootfs/usr/bin/shobika-installer

      - name: Prepare branding package for ISO
        run: |
          # Copy branding files to airootfs for live session
          rsync -av packages/branding/ iso/airootfs/usr/share/shobikaos-branding/
          # Generate PNG wallpaper
          if command -v magick &> /dev/null; then
            magick packages/branding/wallpapers/shobikaos-wallpaper.svg -resize 3840x2160 iso/airootfs/usr/share/backgrounds/shobikaos-wallpaper.png
            magick packages/branding/wallpapers/shobikaos-wallpaper.svg -resize 1920x1080 iso/airootfs/usr/share/backgrounds/shobikaos-wallpaper-1920x1080.png
          elif command -v rsvg-convert &> /dev/null; then
            rsvg-convert -w 3840 -h 2160 packages/branding/wallpapers/shobikaos-wallpaper.svg -o iso/airootfs/usr/share/backgrounds/shobikaos-wallpaper.png
            rsvg-convert -w 1920 -h 1080 packages/branding/wallpapers/shobikaos-wallpaper.svg -o iso/airootfs/usr/share/backgrounds/shobikaos-wallpaper-1920x1080.png
          fi

      - name: Build ISO with archiso
        run: |
          sudo mkarchiso -v -w /tmp/shobikaiso -o out iso/

      - name: Test ISO in QEMU (smoke test)
        run: |
          timeout 120 qemu-system-x86_64 -enable-kvm -m 2G -cpu host \
            -drive file=out/shobikaos-*.iso,format=raw,readonly=on \
            -display none -serial stdio -boot d \
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
            -watchdog i6300esb \
            -watchdog-action reset || true

      - name: Upload ISO
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/shobikaos-*.iso
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shobikaos-iso
          path: out/shobikaos-*.iso
          retention-days: 7

  build-repo:
    runs-on: ubuntu-latest
    needs: build-iso
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create local repository
        run: |
          mkdir -p repo
          # In a real setup, you'd build packages in a clean chroot
          # For now, just verify structure
          ls -la packages/
          echo "Repository structure ready for package building"

      - name: Upload repo
        uses: actions/upload-artifact@v4
        with:
          name: shobikaos-repo
          path: repo/
          retention-days: 7