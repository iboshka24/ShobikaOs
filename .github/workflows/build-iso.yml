name: Build ShobikaOs ISO

on:
  push:
    branches: [ main, master ]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ShobikaOs ISO inside Arch Linux Docker Container
        run: |
          set -o pipefail
          docker run --rm \
            --privileged \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cgroupns host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v /dev:/dev \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:latest \
            bash /workspace/scripts/build_iso.sh 2>&1 | tee build.log

      - name: Push Build Log to build-logs branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add build.log 2>/dev/null || true
          git commit -m "build log update $(date -u)" || true
          git push origin build-logs --force || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShobikaOs-ISO
          path: out/*.iso

      - name: Create Release
        if: always() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            build.log
          generate_release_notes: true
