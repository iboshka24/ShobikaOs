name: Build ShobikaOs ISO

on:
  push:
    branches: [ main, master ]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ShobikaOs ISO inside Arch Linux Docker Container
        run: |
          docker run --rm -i \
            --privileged \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cgroupns host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v /dev:/dev \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:latest \
            bash /workspace/scripts/build_iso.sh > /tmp/build.log 2>&1
          cp /tmp/build.log build.log 2>/dev/null || true
          sudo chmod 777 build.log 2>/dev/null || true

      - name: Push Build Log to build-logs branch
        if: always()
        run: |
          sudo chmod 777 build.log 2>/dev/null || true
          cp build.log /tmp/current_build.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -f -B build-logs
          cp /tmp/current_build.log build.log 2>/dev/null || true
          sudo chmod 777 build.log 2>/dev/null || true
          git add build.log
          git commit -m "build log update $(date -u)" --allow-empty
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/iboshka24/ShobikaOs.git build-logs --force

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShobikaOs-ISO
          path: out/*.iso
          if-no-files-found: error

      - name: Create Release
        if: always() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            build.log
          generate_release_notes: true
