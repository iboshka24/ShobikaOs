id: packagechooser
name: Desktop Environment
description: Choose your desktop environment
icon: preferences-desktop-locale
weight: 4
ui: packagechooser.qml

choices:
  - id: cinnamon
    name: Cinnamon
    description: "Classic desktop with traditional layout. Customized ShobikaOs theme with dark mode, custom icons, and terminal colors."
    image: cinnamon.png
    packages:
      - cinnamon
      - xorg-server
      - xorg-xinit
      - xdg-utils
      - gnome-terminal
      - nemo
      - file-roller
      - eog
      - evince
      - gnome-calculator

  - id: gnome
    name: GNOME
    description: "Modern, minimal desktop. Customized with ShobikaOs theme, extensions, and custom accent colors."
    image: gnome.png
    packages:
      - gnome
      - gnome-extra
      - xorg-server
      - xdg-utils
      - gnome-terminal
      - nautilus
      - file-roller
      - eog
      - evince

  - id: kde
    name: KDE Plasma
    description: "Feature-rich desktop with full customization. Customized ShobikaOs theme with kvantum, custom icons, and widgets."
    image: kde.png
    packages:
      - plasma
      - kde-applications
      - sddm
      - xorg-server
      - xdg-utils
      - konsole
      - dolphin
      - ark
      - gwenview
      - okular
      - kcalc

  - id: xfce
    name: XFCE
    description: "Lightweight, fast desktop. Customized ShobikaOs theme with compositing and custom panel layout."
    image: xfce.png
    packages:
      - xfce4
      - xfce4-goodies
      - xorg-server
      - xdg-utils
      - xfce4-terminal
      - thunar
      - file-roller
      - ristretto
      - evince

  - id: hyprland
    name: Hyprland
    description: "Dynamic tiling Wayland compositor. Customized with ShobikaOs config, waybar, wofi, and custom blur/animation."
    image: hyprland.png
    packages:
      - hyprland
      - hyprpaper
      - hyprlock
      - waybar
      - wofi
      - wl-clipboard
      - grim
      - slurp
      - foot
      - thunar
      - polkit-gnome
      - xdg-desktop-portal-hyprland
