<?xml version="1.0" encoding="UTF-8"?>
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#181825;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#11111b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#89b4fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#89d0fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b4befe;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#89b4fa;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#89b4fa;stop-opacity:0" />
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="3840" height="2160" fill="url(#bgGradient)" />
  
  <!-- Glow effects -->
  <ellipse cx="800" cy="400" rx="600" ry="400" fill="url(#glowGradient)" filter="url(#blur)" />
  <ellipse cx="3200" cy="1800" rx="800" ry="500" fill="url(#glowGradient)" filter="url(#blur)" />
  <ellipse cx="1920" cy="1080" rx="1000" ry="600" fill="url(#glowGradient)" filter="url(#blur)" opacity="0.3" />
  
  <!-- Geometric shapes -->
  <g opacity="0.08">
    <polygon points="1920,200 2200,600 1640,600" fill="url(#accentGradient)" />
    <polygon points="3200,300 3500,100 3600,400" fill="#89b4fa" opacity="0.1" />
    <polygon points="600,1600 400,2000 1000,2000" fill="#89b4fa" opacity="0.1" />
    <rect x="100" y="100" width="200" height="200" fill="none" stroke="url(#accentGradient)" stroke-width="2" transform="rotate(-15 200 200)" />
    <rect x="3540" y="1860" width="200" height="200" fill="none" stroke="url(#accentGradient)" stroke-width="2" transform="rotate(30 3640 1960)" />
  </g>
  
  <!-- Center logo area -->
  <g transform="translate(1920, 900)">
    <!-- ShobikaOs text -->
    <text x="0" y="0" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="120" font-weight="700" fill="url(#accentGradient)" letter-spacing="8">
      SHOBIKAOS
    </text>
    <text x="0" y="80" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="32" font-weight="300" fill="#a6adc8" letter-spacing="4">
      Arch-based Linux Distribution
    </text>
    
    <!-- Decorative line -->
    <line x1="-200" y1="140" x2="200" y2="140" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Version -->
    <text x="0" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" fill="#6c7086">
      Rolling Release • Built with Rust
    </text>
  </g>
  
  <!-- Bottom brand -->
  <g transform="translate(1920, 1900)">
    <text x="0" y="0" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="18" fill="#6c7086">
      github.com/shobikaos/ShobikaOs
    </text>
  </g>
  
  <!-- Corner accents -->
  <g stroke="url(#accentGradient)" stroke-width="2" fill="none" opacity="0.3">
    <!-- Top-left -->
    <path d="M 100 200 L 100 100 L 200 100" />
    <!-- Top-right -->
    <path d="M 3740 100 L 3640 100 L 3640 200" />
    <!-- Bottom-left -->
    <path d="M 100 2060 L 100 1960 L 200 1960" />
    <!-- Bottom-right -->
    <path d="M 3740 2060 L 3640 2060 L 3640 1960" />
  </g>
  
  <!-- Floating particles -->
  <g fill="url(#accentGradient)" opacity="0.4">
    <circle cx="300" cy="800" r="3" />
    <circle cx="3600" cy="500" r="2" />
    <circle cx="500" cy="1400" r="2" />
    <circle cx="3400" cy="1600" r="3" />
    <circle cx="1200" cy="200" r="2" />
    <circle cx="2800" cy="100" r="2" />
    <circle cx="1800" cy="1900" r="3" />
    <circle cx="2200" cy="2000" r="2" />
  </g>
</svg>