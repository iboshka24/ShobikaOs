DEFAULT shobikaos
TIMEOUT 150

LABEL shobikaos
TEXT HELP
Boot ShobikaOs Live on BIOS.
Install ShobikaOs or perform system maintenance.
ENDTEXT
MENU LABEL ShobikaOs Live (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.firstboot=0 quiet splash loglevel=3
