# ShobikaOs LightDM Webkit2 Greeter Theme
# Install to /usr/share/lightdm-webkit/themes/shobikaos/

[greeter]
webkit_theme = shobikaos
background = /usr/share/backgrounds/shobikaos-wallpaper.png
user_background = false
show_indicators = true
clock_format = %H:%M
theme_name = Arc-Dark
icon_theme_name = Papirus-Dark
font_name = Noto Sans 10
xft_antialias = true
xft_hintstyle = hintslight
xft_rgba = rgb