# ShobikaOs SDDM Theme
# Install to /usr/share/sddm/themes/shobikaos/

[Theme]
Name=ShobikaOs
Description=ShobikaOs SDDM Theme
Author=ShobikaOs Team
Version=1.0
Website=https://github.com/shobikaos/ShobikaOs

# Main configuration
MainQml=Main.qml
ConfigFile=theme.conf

# Background
Background=background.png

# Input fields
InputField={
    "background": "#1e1e2e",
    "border": "#313244",
    "border-radius": 8,
    "color": "#cdd6f4",
    "font": "Noto Sans",
    "font-size": 16,
    "padding": 12,
    "placeholder-color": "#6c7086",
    "selection-color": "#89b4fa"
}

# Button
Button={
    "background": "#313244",
    "border": "#45475a",
    "border-radius": 8,
    "color": "#cdd6f4",
    "font": "Noto Sans",
    "font-size": 14,
    "font-weight": 500,
    "padding": 10,
    "hover-background": "#45475a",
    "hover-color": "#89b4fa",
    "pressed-background": "#89b4fa",
    "pressed-color": "#1e1e2e"
}

# Suggested action button
SuggestedButton={
    "background": "#89b4fa",
    "border": "#89b4fa",
    "border-radius": 8,
    "color": "#1e1e2e",
    "font": "Noto Sans",
    "font-size": 14,
    "font-weight": 600,
    "padding": 10,
    "hover-background": "#7aa2f7",
    "pressed-background": "#6c8ed4"
}

# Clock
Clock={
    "color": "#cdd6f4",
    "font": "JetBrains Mono",
    "font-size": 48,
    "format": "HH:mm"
}

# Date
Date={
    "color": "#a6adc8",
    "font": "Noto Sans",
    "font-size": 16,
    "format": "dddd, MMMM d, yyyy"
}

# User list
UserList={
    "avatar-size": 96,
    "background": "#181825",
    "border": "#313244",
    "border-radius": 12,
    "name-color": "#cdd6f4",
    "name-font": "Noto Sans",
    "name-font-size": 16,
    "name-font-weight": 600,
    "session-color": "#a6adc8",
    "session-font": "Noto Sans",
    "session-font-size": 13
}

# Session selector
SessionSelector={
    "background": "#181825",
    "border": "#313244",
    "border-radius": 8,
    "color": "#cdd6f4",
    "font": "Noto Sans",
    "font-size": 14
}

# Layout
Layout={
    "type": "centered",
    "spacing": 24,
    "margins": 48
}