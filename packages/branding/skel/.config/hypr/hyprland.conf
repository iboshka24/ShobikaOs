# ShobikaOs Hyprland Config
# ~/.config/hypr/hyprland.conf

# Environment variables
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = QT_QPA_PLATFORMTHEME,gtk2
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GTK_THEME,ShobikaOs-Dark
env = STEAM_FORCE_DESKTOPUI_SCALING,1

# Monitor
monitor=,preferred,auto,1

# General
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(b4befeaa) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    allow_tearing = false
    animate_manual_resizes = true
    resize_on_border = true
}

# Decoration
decoration {
    rounding = 10
    
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 0.9
        brightness = 0.8
    }
    
    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 3
    shadow_color = rgba(1a1a1aee)
    shadow_ignore_window = true
    
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
}

# Animations
animations {
    enabled = true
    bezier = snazzy, 0.25, 1, 0.5, 1
    bezier = smooth, 0.4, 0, 0.2, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    animation = windows, 1, 7, snazzy
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    animation = sliding, 1, 7, smooth
}

# Dwindle
dwindle {
    pseudotile = true
    preserve_split = true
    split_width_multiplier = 1.0
}

# Master
master {
    new_is_master = true
    new_on_bottom = false
}

# Input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag-lock = false
        disable_while_typing = true
    }
    sensitivity = 0
    accel_profile = flat
}

# Gestures
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = false
    workspace_swipe_min_speed_to_force = 30
}

# Misc
misc {
    force_default_wallpaper = false
    disable_hyprland_logo = true
    vfr = true
    animate_manual_resizes = true
    enable_swallow = true
    swallow_regex = ^(foot|kitty|alacritty)$
}

# Window rules
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = opacity 0.95 0.95, class:^(foot|kitty|alacritty)$
windowrulev2 = rounding 0, class:^(wofi|waybar)$
windowrulev2 = noblur, class:^(wofi|waybar|rofi)$
windowrulev2 = noshadow, class:^(wofi|waybar|rofi)$

# Keybindings
$mod = SUPER

# Terminal
bind = $mod, Return, exec, foot
bind = $mod SHIFT, Return, exec, foot -e tmux

# App launcher
bind = $mod, D, exec, wofi --show drun
bind = $mod SHIFT, D, exec, wofi --show run

# Close/Kill
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exec, pkill -9 -f

# Fullscreen
bind = $mod, F, fullscreen,
bind = $mod SHIFT, F, fullscreen, 1

# Floating toggle
bind = $mod, V, togglefloating,
bind = $mod SHIFT, V, togglefloating, address:focused

# Exit
bind = $mod, M, exit,
bind = $mod SHIFT, M, exec, wofi --show power

# Focus
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Special workspace
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Resize
bind = $mod CTRL, H, resizeactive, -50 0
bind = $mod CTRL, L, resizeactive, 50 0
bind = $mod CTRL, K, resizeactive, 0 -50
bind = $mod CTRL, J, resizeactive, 0 50

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mod, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Volume
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media keys
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Reload config
bind = $mod SHIFT, R, reload,

# Autostart
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = /usr/lib/xdg-desktop-portal &
exec-once = mkdir -p ~/Pictures/Screenshots
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store
exec-once = hyprctl setcursor Adwaita 24

# Window rules for specific apps
windowrulev2 = workspace 2, class:^(firefox|librewolf|zen-browser)$
windowrulev2 = workspace 3, class:^(code|Code|vscode)$
windowrulev2 = workspace 4, class:^(discord|Discord|vesktop)$
windowrulev2 = workspace 5, class:^(spotify|Spotify)$